name: Validar integracao PDV Facil
on:
  pull_request:
    branches: [main]
  push:
    branches: [integracao-p0-financeiro-compras]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run test:p0
      - run: npm run test:purchase-finance
        env:
          JWT_SECRET: test-only-not-production
          ACCOUNT_EMAIL_MODE: mock
